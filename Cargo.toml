[workspace]
members = ["crates/mcm-core", "crates/mcm-export", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["serde", "std"] }
quick-xml = { version = "0.38.3", features = ["serialize"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
uuid = { version = "1.18.1", features = ["v4", "v5", "serde"] }
zip = { version = "4.5.0", default-features = false, features = ["deflate"] }
