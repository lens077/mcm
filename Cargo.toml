[workspace]
members = ["crates/mcm-core", "crates/mcm-export", "crates/mcm-import", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["serde", "std"] }
quick-xml = { version = "0.38.3", features = ["serialize"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
uuid = { version = "1.18.1", features = ["v4", "v5", "serde"] }
zip = { version = "4.5.0", default-features = false, features = ["deflate"] }

# 发布包去掉符号表：导入图表引入 OCR 引擎与模型后 .app 逼近 25 MB 预算，
# strip 省下约 5 MB 余量。panic 信息仍保留，只是回溯里没有函数名。
[profile.release]
strip = true

# OCR 推理在 debug 构建下慢两个数量级，`cargo test` 会被拖到分钟级。
# 只对推理与图像解码相关的依赖开优化，其余保持 debug 以免拖慢增量编译。
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.mcm-import]
opt-level = 2
