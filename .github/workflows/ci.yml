name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Successor to pnpm/action-setup for pnpm v11+. It installs pnpm as a
      # self-contained binary AND the JS runtime, so actions/setup-node is no
      # longer needed. The pnpm version still comes from the `packageManager`
      # field in package.json, so CI and the repo cannot drift apart.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          # `pnpm install` stays an explicit step below: --frozen-lockfile is a
          # merge gate (the lockfile must be committed and current) and that
          # guarantee should be visible, not inherited from a CI-env default.
          install: false
      - uses: dtolnay/rust-toolchain@stable
        # One `components` input, comma-separated. Written as a flow mapping the
        # comma split it into a second, undefined key and rustfmt was silently
        # never installed.
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        # Block style: a `${{ }}` expression cannot sit inside a YAML flow
        # mapping, because `{` starts a nested mapping there.
        with:
          key: ${{ matrix.os }}

      - name: Toolchain versions
        run: |
          pnpm --version
          node --version
          cargo --version

      - run: pnpm install --frozen-lockfile

      # `tauri::generate_context!` embeds the frontend bundle at compile time,
      # so `dist/` must exist before ANY cargo command that builds mcm-app.
      # It is gitignored, which is why a clean checkout needs this first.
      - name: Build frontend (required by the Tauri context macro)
        run: pnpm build

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Performance budgets are a merge gate (宪法 II): the bench panics when a
      # budget in plan.md §Performance Goals regresses.
      - run: cargo bench -p mcm-core

      - run: pnpm lint
      - run: pnpm test

      # The scripted scenario harness runs on both platforms, so the shared
      # checklist (quickstart.md §端到端验证场景) really is a dual-platform gate.
      # The WebDriver UI suite lives in e2e-windows.yml until it is validated
      # against a real Windows machine (see HANDOVER.md §6.2).
      - name: Scenario smoke (shared checklist)
        run: pnpm smoke

      - run: pnpm tauri build

      # Installer size is a merge gate (plan.md §Constraints ≤ 25MB).
      - run: pnpm check:bundle
      - run: pnpm measure:startup
