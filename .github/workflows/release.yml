# 打标签才发版：推送 vX.Y.Z 形式的标签，构建 macOS 与 Windows 安装包。
#
# 为什么用标签而不是"推代码就自动发版"：
#   自动发版会让每次代码改动都产生一个版本，版本号涨得毫无意义，
#   使用者也分不清哪个值得升级。发版是一个人为决定，应当显式表达。
#
# 为什么标签带 v 前缀：
#   git 标签用 vX.Y.Z 是生态惯例（Rust、Go 及绝大多数项目），
#   GitHub Release 页面也默认这么显示；而 Cargo/npm 的 version 字段
#   本身不带 v。两者分工清晰，且本仓库已有的 v0.1.0~v0.1.3 就是这个形式。
#
# 流程
#   verify  校验标签与代码里声明的版本一致
#   build   双平台打包（产物文件名内嵌版本号）
#   publish 下载产物、生成校验和、创建 Release
#
# 发版步骤见 `make release`：它会递增版本、提交、打标签并推送。

name: release

on:
  push:
    tags:
      # 只认 vX.Y.Z；预发布标签（v1.0.0-rc1）不在此流程内
      - "v[0-9]+.[0-9]+.[0-9]+"
  # 手动重跑某个已存在的标签（例如上次因额度失败）
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的标签，如 v0.1.4"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发版不可中途取消，否则版本号会跳空

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 校验标签与代码版本一致 ──────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: check
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          declared=$(jq -r .version src-tauri/tauri.conf.json)

          # 标签与代码声明必须一致：安装包文件名内嵌的是 declared，
          # 不一致会导致产物名与 Release 标签对不上。
          if [ "$version" != "$declared" ]; then
            echo "::error::标签 $tag 与代码内版本 $declared 不一致。" \
                 "请先用 make release 递增版本并提交，再打标签。"
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "将发布 $tag（版本 $version）"

  # ── 双平台构建安装包 ──────────────────────────────────────────────
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 检出带新版本号的提交，产物名才与 Release tag 一致
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      # 与 ci.yml 同因：generate_context! 编译期嵌入前端产物
      - name: Build frontend
        run: pnpm build

      - name: Bundle installer
        run: pnpm bundle

      # 发布前最后一道闸：产物本身能跑通共享场景清单。
      # release 二进制已由上一步构建，这步几乎不额外耗时。
      - name: Scenario smoke
        run: pnpm smoke

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          # bundle.targets 为 "all"：macOS 出 .dmg，Windows 同时出 .msi 与 NSIS .exe。
          # 按后缀收集而非写死单一路径，少一种也不会静默漏掉。
          # 排除 rw.<pid>.*.dmg —— 那是 bundle_dmg.sh 的读写中间映像，非交付物。
          found=0
          while IFS= read -r file; do
            base=$(basename "$file")
            case "$base" in rw.[0-9]*.*) continue ;; esac
            cp "$file" out/
            found=$((found + 1))
          done < <(find target/release/bundle \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -type f)

          if [ "$found" -eq 0 ]; then
            echo "未找到任何安装包，bundle 目录内容如下：" >&2
            find target/release/bundle -maxdepth 2 >&2 || true
            exit 1
          fi
          echo "收集到 $found 个安装包："
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  # ── 发布 Release ──────────────────────────────────────────────────
  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          ls -la
          # 逐个显式传文件名：既避免以 - 开头的名字被当成选项（用 -- 隔断），
          # 又不会像 `sha256sum ./*` 那样把 ./ 前缀写进清单，
          # 使 `sha256sum -c SHA256SUMS` 在任意目录下都能直接用。
          : > SHA256SUMS
          for file in *; do
            [ -f "$file" ] || continue
            [ "$file" = SHA256SUMS ] && continue
            sha256sum -- "$file" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.verify.outputs.tag }}"
          gh release create "$tag" \
            --title "$tag" \
            --target "${{ needs.verify.outputs.sha }}" \
            --generate-notes \
            artifacts/*

      - name: Summary
        run: |
          {
            echo "### 已发布 v${{ needs.verify.outputs.version }}"
            echo ""
            echo "附件："
            find artifacts -maxdepth 1 -type f -printf '- %f\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"
