# 每次代码改动推送到 main，自动递增版本并发布正式版 Release。
#
# 流程
#   plan    递增补丁版本 -> 提交回 main -> 输出新版本与提交 SHA
#   build   检出该提交，双平台打包（产物文件名即带新版本号）
#   publish 下载产物、生成校验和、创建 Release
#
# 为什么 plan 要先提交再构建：安装包文件名内嵌版本号，若先构建后改版本，
# 产物名会停留在旧版本，与 Release tag 对不上。
#
# 不会触发递归：GitHub 明确规定用 GITHUB_TOKEN 推送的提交不会再触发工作流。
# 提交信息仍带 [skip ci] 作为双保险，并让意图对读日志的人可见。
#
# 纯文档改动不发版（见 paths-ignore）。

name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "specs/**"
      - ".github/workflows/e2e-windows.yml"
  workflow_dispatch:
    inputs:
      bump:
        description: "版本递增级别"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发版不可中途取消，否则版本号会跳空

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 递增版本并提交回仓库 ──────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false
      - uses: dtolnay/rust-toolchain@stable

      - id: bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version=$(node scripts/bump-version.mjs "${{ inputs.bump || 'patch' }}")
          # 工作区成员版本变了，让 cargo 自己刷新 lock 而不是正则替换
          cargo update -w --offline

          git add Cargo.toml Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): v${version} [skip ci]"

          # 期间可能有别人推送，先变基再推
          git pull --rebase --autostash origin main
          git push origin HEAD:main

          {
            echo "version=${version}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  # ── 双平台构建安装包 ──────────────────────────────────────────────
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 检出带新版本号的提交，产物名才与 Release tag 一致
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - run: pnpm install --frozen-lockfile

      # 与 ci.yml 同因：generate_context! 编译期嵌入前端产物
      - name: Build frontend
        run: pnpm build

      - name: Bundle installer
        run: pnpm bundle

      # 发布前最后一道闸：产物本身能跑通共享场景清单。
      # release 二进制已由上一步构建，这步几乎不额外耗时。
      - name: Scenario smoke
        run: pnpm smoke

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          # bundle.targets 为 "all"：macOS 出 .dmg，Windows 同时出 .msi 与 NSIS .exe。
          # 按后缀收集而非写死单一路径，少一种也不会静默漏掉。
          # 排除 rw.<pid>.*.dmg —— 那是 bundle_dmg.sh 的读写中间映像，非交付物。
          found=0
          while IFS= read -r file; do
            base=$(basename "$file")
            case "$base" in rw.[0-9]*.*) continue ;; esac
            cp "$file" out/
            found=$((found + 1))
          done < <(find target/release/bundle \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) -type f)

          if [ "$found" -eq 0 ]; then
            echo "未找到任何安装包，bundle 目录内容如下：" >&2
            find target/release/bundle -maxdepth 2 >&2 || true
            exit 1
          fi
          echo "收集到 $found 个安装包："
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  # ── 发布 Release ──────────────────────────────────────────────────
  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          ls -la
          # 逐个显式传文件名：既避免以 - 开头的名字被当成选项（用 -- 隔断），
          # 又不会像 `sha256sum ./*` 那样把 ./ 前缀写进清单，
          # 使 `sha256sum -c SHA256SUMS` 在任意目录下都能直接用。
          : > SHA256SUMS
          for file in *; do
            [ -f "$file" ] || continue
            [ "$file" = SHA256SUMS ] && continue
            sha256sum -- "$file" >> SHA256SUMS
          done
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.plan.outputs.version }}"
          gh release create "$tag" \
            --title "$tag" \
            --target "${{ needs.plan.outputs.sha }}" \
            --generate-notes \
            artifacts/*

      - name: Summary
        run: |
          {
            echo "### 已发布 v${{ needs.plan.outputs.version }}"
            echo ""
            echo "附件："
            find artifacts -maxdepth 1 -type f -printf '- %f\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"
